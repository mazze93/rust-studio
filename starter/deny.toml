# Example dependency policy for this learning project; adapt before real use.
[advisories]
version = 2
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
private = { ignore = true }
# The allowances are an example for when dependencies arrive; with none yet,
# silence the "unmatched license allowance" noise instead of teaching people
# to ignore warnings.
unused-allowed-license = "allow"
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
